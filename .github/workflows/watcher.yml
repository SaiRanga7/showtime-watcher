name: Showtime Watcher

on:
  schedule:
    # Every 5 minutes, offset from :00 because GitHub's scheduler is busiest (and most
    # delayed) at the top of the hour. Times are UTC, but every 5 min means 24x7 anyway.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = normal check · probe = show what a cinema is selling · test-alert = ping every channel"
        type: choice
        options: [run, probe, test-alert]
        default: run
      cinema:
        description: "probe only: cinema link (blank = default cinema in targets.yaml)"
        required: false
        default: ""
      date:
        description: "probe only: date, e.g. 2026-10-30 / 30 Oct / tomorrow (blank = today)"
        required: false
        default: ""

permissions:
  contents: write # commit state.json / targets.yaml back to the repo

concurrency:
  group: showtime-watcher # one run at a time, so state.json never races
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.32"
  PYTHONUNBUFFERED: "1"

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      MODE: ${{ github.event_name == 'schedule' && 'run' || inputs.mode }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Check BookMyShow
        if: env.MODE == 'run'
        run: uv run --frozen --no-dev showtime-watcher run

      - name: Probe a cinema
        if: env.MODE == 'probe'
        env:
          CINEMA: ${{ inputs.cinema }}
          DATE: ${{ inputs.date }}
        run: uv run --frozen --no-dev showtime-watcher probe "$CINEMA" --date "$DATE"

      - name: Send a test alert
        if: env.MODE == 'test-alert'
        run: uv run --frozen --no-dev showtime-watcher test-alert

      - name: Save state
        if: always() && env.MODE == 'run'
        run: |
          if [ -z "$(git status --porcelain -- state.json targets.yaml)" ]; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json targets.yaml
          git commit -m "watcher: update state [skip ci]"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected (someone else pushed); rebasing and retrying..."
            git pull --rebase || { git rebase --abort; exit 1; }
            sleep $((attempt * 3))
          done
          exit 1
