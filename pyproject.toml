[project]
name = "showtime-watcher"
version = "2.1.0"
description = "Get alerted the moment BookMyShow opens bookings for a movie at your cinema."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tzdata>=2024.1", # IANA time zones for zoneinfo on Windows
]

[project.scripts]
showtime-watcher = "showtime_watcher.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Alerts deliberately use typographic characters (– · ₹ ➕ ℹ).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
